version: '3.9'
services:
  app:
    image: hardened-flask-app
    deploy:
      replicas: 1
      
    secrets:
        - db_password
    ports:
      - "5000:5000"
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true

secrets:
  db_password:
    external: true
