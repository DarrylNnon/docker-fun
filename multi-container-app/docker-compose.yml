version: "3.9"

services: 
  frontend:
    image: nginx:latest
    container_name: nginx-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx-custom:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - app

  backend:
    image: redis:latest
    container_name: redis-backend
    ports:
      - "6379:6379"

  app:
    image: python:3.9-slim
    container_name: flask-app
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "pip install flask redis && python app.py"
    depends_on:
      - backend


